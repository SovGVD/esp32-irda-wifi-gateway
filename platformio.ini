; PlatformIO Project Configuration File
; ESP32-C3 SuperMini IrDA Serial Device for Linux / Palm OS HotSync
;
; Target SoC: ESP32-C3 SuperMini (RISC-V)
; Optical Transceiver: Vishay TFBS4711 (SIR up to 115.2 kbps)
; Framework: Arduino on top of ESP-IDF. ESP-IDF is built from source with the
; options in sdkconfig.defaults, because the prebuilt Arduino network stack has
; no PPP / IP forwarding / NAT, which the Wi-Fi Internet gateway needs.

[platformio]
default_envs = esp32-c3-supermini

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.flash_mode = dio
board_build.partitions = partitions.csv
framework = arduino, espidf

; Serial Monitor speed
monitor_speed = 115200

; Upload settings
upload_speed = 921600

; ESP32-C3 Native USB Serial (CDC-ACM) configuration
; The SuperMini USB-C port connects directly to internal USB D- (GPIO18) and D+ (GPIO19).
; -DARDUINO_USB_CDC_ON_BOOT=1 directs Serial to the native USB CDC ACM controller.
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -O2

; Uncomment and set your specific port if multiple serial devices are plugged in:
; upload_port = /dev/ttyACM0
; monitor_port = /dev/ttyACM0
